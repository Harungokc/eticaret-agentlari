name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.arac }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        arac: ["01-pazar-ve-komisyon-analizcisi", "02-urun-fiyat-ve-rakip-analizcisi", "03-yorum-analizcisi", "04-satis-bolge-analizcisi"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testleri çalıştır
        working-directory: ${{ matrix.arac }}
        env:
          PYTHONUTF8: "1"
        run: python -m unittest -v
